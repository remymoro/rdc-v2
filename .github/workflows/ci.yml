# Intégration continue (ADR-0003 R4, ADR-0010).
# main est protégée : une pull request n'y est fusionnée que si le check « ci »
# est vert, sur un code à jour avec main.
name: CI

on:
  # Chaque pull request vers main (et chaque nouveau push sur sa branche).
  pull_request:
    branches: [main]
  # main elle-même, après chaque fusion : sert de base à `nx affected`.
  push:
    branches: [main]
  # Lancement manuel (onglet Actions), sur n'importe quelle branche.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le nom du job est celui du check obligatoire dans la protection de main.
  ci:
    name: ci
    runs-on: ubuntu-24.04

    # PostgreSQL 16 pour les tests d'intégration (ADR-0004, ADR-0008).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rdc
          POSTGRES_PASSWORD: rdc
          POSTGRES_DB: rdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdc -d rdc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rdc:rdc@localhost:5432/rdc_test
      DATABASE_URL_TEST: postgresql://rdc:rdc@localhost:5432/rdc_test

    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet : nécessaire à `nx affected` pour trouver la base.
          fetch-depth: 0

      # Version de pnpm lue dans le champ `packageManager` de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Échoue si pnpm-lock.yaml n'est pas synchronisé avec package.json.
      - run: pnpm install --frozen-lockfile

      # Le client Prisma généré n'est pas versionné : il faut le produire.
      - name: Génération du client Prisma
        run: pnpm prisma generate

      - name: Tests de l'Agent Gate
        run: pnpm test:agent-gate

      # Base = dernier commit de main dont la CI est verte.
      - uses: nrwl/nx-set-shas@v5

      - name: Formatage
        run: pnpm nx format:check

      - name: Lint (architecture comprise), types, tests et build des projets touchés
        run: pnpm nx affected -t lint typecheck test build

      # Les 33 migrations (v1 + v2) doivent s'appliquer sur une base vierge.
      - name: Migrations sur une base vierge
        run: pnpm prisma migrate deploy

      - name: Tests d'intégration (PostgreSQL) des projets touchés
        run: pnpm nx affected -t test-integration

      # L'API est compilée et démarrée par la cible (dependsOn api:serve),
      # sur la base rdc_test (DATABASE_URL du job).
      - name: Tests E2E HTTP des projets touchés
        run: pnpm nx affected -t e2e

      - name: Audit de sécurité des dépendances de production
        run: pnpm audit --prod --audit-level high
