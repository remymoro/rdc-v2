# PostgreSQL pour le développement et les tests d'intégration (ADR-0008).
# Même version que la production RDC v1.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
      POSTGRES_DB: rdc
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rdc -d rdc']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
